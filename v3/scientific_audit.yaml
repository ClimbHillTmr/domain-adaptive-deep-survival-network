audit_version: v3_scientific_audit_2
status: active_pretraining_gate
research_contract: CLAUDE.md
data_protocol_version: v3_hbd_data_protocol_1
data_entrypoints:
  - src/data_pipeline/HBD_data.py
  - src/data_pipeline/HBD_data_fuding.py
shared_data_implementation: src/data_pipeline/data_process.py
required_branches: [E1, E2, E3, E4, E5]
required_random_control_families:
  - A_unrestricted_random
  - B_variance_matched
  - C_group_size_matched
  - D_clinical_type_matched
required_artifacts:
  - CLAUDE.md
  - v3/evidence_tree.yaml
  - v3/data_contract/dataset_manifest.csv
  - v3/data_contract/feature_manifest.csv
  - v3/data_contract/feature_allowlist.csv
  - v3/data_contract/split_manifest.csv
  - v3/preprocessing/preprocessing_manifest.csv
  - v3/experiments/experiment_matrix.csv
  - v3/experiments/random_control_plan.yaml
  - v3/experiments/primary_feature_partition.json
  - v3/experiments/random_partitions.csv
  - v3/experiments/transportability_group_plan.csv
  - v3/experiments/server_execution_plan.md
  - v3/experiments/training_protocol.yaml
  - v3/experiments/run_grid.csv
  - v3/experiments/run_grid_manifest.json
  - v3/models/model_specification.md
  - v3/evaluation/statistical_analysis_plan.md
  - v3/registry/evidence_matrix.csv
  - v3/registry/run_registry.csv
  - v3/go_no_go_criteria.md
  - data/v3/data_freeze_manifest.json
training_readiness_rules:
  require_phase_authorization: true
  require_frozen_dataset_rows: true
  require_clinically_approved_features: true
  require_nonempty_split_manifest: true
  require_locked_preprocessing: true
  require_locked_random_control_plan: true
  require_no_historical_runs_in_v3_registry: true
  require_all_pretraining_evidence_protocols_ready: true
interpretation_rules:
  - Structural completeness does not authorize training.
  - Blocked measurement evidence limits claim scope but is not silently omitted.
  - Disease-mechanism attribution remains outside the identifiable two-center design.
  - Negative selective-alignment results complete the study and trigger manuscript Path B or C.
