# Data Column Definitions
columns:
  # Dynamic/Time-Series Features (High-frequency intradialytic data)
  dynamic_cols:
    - "透析中收缩压_mean" # Using mean/std summaries if raw seq not available, but Transformer prefers sequences
    - "透析中舒张压_mean"
    - "透析中脉搏_mean"
    - "超滤率_mean"
    - "静脉压_mean"
    - "血流速_mean"
    - "透析液温度_mean"

  # Raw Sequence Columns (if available in list format in CSV)
  seq_cols:
    - "透析中收缩压"
    - "透析中舒张压"
    - "透析中脉搏"
    - "超滤率"
    - "静脉压"
    - "血流速"

  # Static Patient Features (21: Clinical + Variability + History, both domains exist)
  static_cols:
    # === Tier 1: Core Hemodynamics (SHAP top features) ===
    - "透前收缩压" # Pre-dialysis SBP: strongest predictor
    - "透前舒张压" # Pre-dialysis DBP: perfusion pressure
    - "透析年龄" # Patient age at dialysis
    - "性别" # Gender: physiological differences
    
    # === Tier 2: Blood Pressure Variability (intradialytic std) ===
    - "透析中收缩压_std" # SBP variability: hemodynamic instability marker
    - "透析中舒张压_std" # DBP variability: autonomic dysfunction marker
    
    # === Tier 3: Derived Hemodynamic Features (clinical relevance) ===
    - "透前动脉压" # Pre-dialysis arterial pressure
    - "透后收缩压" # Post-dialysis SBP: treatment response
    - "透后舒张压" # Post-dialysis DBP
    - "透后动脉压" # Post-dialysis arterial pressure
    
    # === Tier 4: Volume & Treatment ===
    - "透前体重" # Pre-dialysis weight
    - "干体重" # Dry weight: fluid status reference
    - "超滤量MAX" # Maximum ultrafiltration volume
    - "透析龄" # Dialysis vintage
    
    # === Tier 5: Historical Hypotension Patterns ===
    - "history_LBP_times_0" # Count of sessions with 0 hypotension events
    - "history_LBP_times_1" # Count of sessions with 1 hypotension event
    - "history_LBP_times_2" # Count of sessions with 2 hypotension events
    - "history_LBP_times_3" # Count of sessions with 3 hypotension events
    - "history_LBP_times_4" # Count of sessions with 4+ hypotension events
    - "history_HBP_rate" # Historical hypertension rate
    
    # === Tier 6: Clinical Comorbidities & Settings ===
    - "高血压诊断" # Hypertension diagnosis
    - "透析液钙浓度" # Dialysate calcium concentration
    - "透析液电导率" # Dialysate conductivity

  # Target Definition
  targets:
    event_col: "events" # 1 for Hypotension/IDH, 0 otherwise
    duration_col: "et_min" # Time to event in minutes
    label_col: "stage_30_60_120" # Risk stage label

# Model Hyperparameters
model:
  name: "resnet1d" # 'resnet1d', 'transformer', 'lgbm', or 'hybrid'

  # Dynamic Encoder: ResNet1D (replaces Transformer for seq_len <= 12)
  dynamic_encoder:
    type: "resnet1d" # 'resnet1d' or 'transformer'
    d_model: 96 # Increased from 64 for better feature representation

  # Legacy Transformer Config (kept for backward compatibility)
  transformer:
    d_model: 96 # Increased from 64 to match dynamic encoder
    nhead: 6 # Increased from 4 to match larger d_model
    num_layers: 2
    dropout: 0.1
    max_len: 48 # Max sequence length (e.g., 4 hours * 12 measurements/hr)

  lgbm:
    n_estimators: 100
    learning_rate: 0.05
    max_depth: -1
    num_leaves: 31

# Training Configuration
training:
  batch_size: 64 # Increased for more stable gradient estimation in Cox loss
  epochs: 50 # Increased from 20 to allow full convergence
  learning_rate: 5e-4 # Reduced from 1e-3 for more stable Cox loss optimization
  weight_decay: 1e-3 # Increased for stronger regularization
  early_stopping_patience: 10 # Increased to allow more patience with 50 epochs
  cv_folds: 5
  
  # Training Strategy Upgrades (B+C optimization)
  use_weighted_cox: false # Disabled: was causing target domain C-index collapse (0.34)
  event_weight: 1.2 # Reduced from 2.0 to prevent overfitting to events
  warmup_epochs: 10 # Increased from 5 for smoother LR transition

  # Domain Adaptation (MMD - replaces CORAL for better low-dimensional alignment)
  coral:
    enabled: true
    lambda_coral: 0.1 # Reduced from 0.5 to prevent MMD from dominating Cox loss

# Survival Analysis Configuration
survival:
  enabled: true
  method: "cox" # 'cox' or 'deephit'

# Risk Boundaries (in minutes)
boundaries:
  b1: 30
  b2: 60
  b3: 120
