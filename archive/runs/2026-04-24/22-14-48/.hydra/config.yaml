columns:
  dynamic_cols:
  - 透析中收缩压_mean
  - 透析中舒张压_mean
  - 透析中脉搏_mean
  - 超滤率_mean
  - 静脉压_mean
  - 血流速_mean
  - 透析液温度_mean
  seq_cols:
  - 透析中收缩压
  - 透析中舒张压
  - 透析中脉搏
  - 超滤率
  - 静脉压
  - 血流速
  static_cols:
  - 透析年龄
  - 透前收缩压
  - 透前舒张压
  - 干体重
  - 透前体重
  - 超滤量MAX
  - 高血压诊断
  - 透析龄
  - 性别
  - 透前呼吸频率
  - history_HBP_rate
  - 透析液钙浓度
  targets:
    event_col: events
    duration_col: et_min
    label_col: stage_30_60_120
model:
  name: resnet1d
  dynamic_encoder:
    type: resnet1d
    d_model: 64
    dropout: 0.1
  transformer:
    d_model: 64
    nhead: 4
    num_layers: 2
    dropout: 0.1
    max_len: 48
  lgbm:
    n_estimators: 100
    learning_rate: 0.05
    max_depth: -1
    num_leaves: 31
training:
  batch_size: 64
  epochs: 50
  learning_rate: 0.0005
  weight_decay: 0.001
  early_stopping_patience: 10
  cv_folds: 5
  use_weighted_cox: true
  event_weight: 2.0
  warmup_epochs: 5
  coral:
    enabled: true
    lambda_coral: 0.5
survival:
  enabled: true
  method: cox
boundaries:
  b1: 30
  b2: 60
  b3: 120
experiment:
  name: phase_classification_v1
  seed: 42
  seeds:
  - 42
  - 123
  - 456
  train_csv: data_preprocessing/data/深医_final_data.csv
  external_csv: data_preprocessing/data/福鼎_final_data.csv
  save_dir: ./runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  use_gpu: true
  debug: false
